<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E0A"/>
      <stop offset="50%" stop-color="#121F15"/>
      <stop offset="100%" stop-color="#1B2E1F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFCB3D"/>
      <stop offset="100%" stop-color="#F1A344"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC78"/>
      <stop offset="100%" stop-color="#5D9253"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#557945" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Compass Star / Sparkle in top right -->
  <path d="M46 12 L47.5 17 L52.5 18.5 L47.5 20 L46 25 L44.5 20 L39.5 18.5 L44.5 17 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Geometric Modern 'G' Monogram -->
  <path d="M44 26 C41 21 35 18 28 18 C18 18 12 24.5 12 33 C12 41.5 18 48 29 48 C37 48 42 44 44 38 L29 38 L29 32 L50 32 C50.5 35 50.5 38 49.5 41 C46.5 48.5 39 53 29 53 C15 53 6 44 6 33 C6 21.5 15 13 28 13 C36.5 13 43.5 17 47.5 23.5 Z" 
        fill="url(#goldGrad)" 
        stroke="#FFCB3D" 
        stroke-width="0.5"/>

  <!-- Inner Compass Needle / Accent Dot -->
  <circle cx="29" cy="33" r="3.5" fill="url(#emeraldGrad)"/>
</svg>